<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>リズムスターズ</title>
<style>
  html, body { margin: 0; height: 100%; background: #07071a; overflow: hidden; }
  body { font-family: "Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; color: #fff;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; display: block; touch-action: none; user-select: none; }
  .ov { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .ov.hidden { display: none; }
  .panel { pointer-events: auto; text-align: center; max-height: 100vh; overflow: auto; padding: 64px 16px 24px; width: 100%; box-sizing: border-box; }
  #title { background: radial-gradient(ellipse at 50% 40%, rgba(60,20,120,.35), rgba(5,4,26,.55) 70%); }
  .logo-sub { font-size: clamp(12px, 2vw, 18px); letter-spacing: .5em; font-weight: 700; opacity: .75; margin-bottom: 4px; }
  .logo { font-size: clamp(42px, 9.5vw, 104px); font-weight: 900; letter-spacing: .04em; line-height: 1.15; padding: 0 10px;
          background: linear-gradient(90deg,#ff4f8b,#ffd23f,#3dffb0,#4fc3ff,#ff4f8b); background-size: 300% auto;
          -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 4s linear infinite;
          filter: drop-shadow(0 0 22px rgba(255,120,220,.45)); }
  @keyframes shine { from { background-position: 0% 0; } to { background-position: 300% 0; } }
  .hiscore { margin: 10px 0 18px; font-size: clamp(14px, 2.2vw, 20px); font-weight: 900; letter-spacing: .15em; color: #ffd23f;
             text-shadow: 0 0 16px rgba(255,210,63,.6); font-variant-numeric: tabular-nums; }
  .diff-label { font-size: 13px; letter-spacing: .3em; opacity: .7; font-weight: 700; margin-bottom: 8px; }
  .diff { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
  .diff button { padding: 12px 22px; border-radius: 14px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
                 color: #fff; font-weight: 900; font-size: 17px; cursor: pointer; font-family: inherit; transition: transform .12s, box-shadow .2s, border-color .2s, background .2s; min-width: 120px; }
  .diff button:hover { transform: translateY(-2px); }
  .diff button small { display: block; font-size: 11px; opacity: .7; font-weight: 700; letter-spacing: .1em; margin-top: 2px; }
  .diff button.d0.sel { border-color: #3dffb0; background: rgba(61,255,176,.18); box-shadow: 0 0 22px rgba(61,255,176,.45); }
  .diff button.d1.sel { border-color: #ffd23f; background: rgba(255,210,63,.18); box-shadow: 0 0 22px rgba(255,210,63,.45); }
  .diff button.d2.sel { border-color: #ff4f8b; background: rgba(255,79,139,.18); box-shadow: 0 0 22px rgba(255,79,139,.45); }
  .btn { padding: 16px 56px; border-radius: 18px; border: 0; font-size: clamp(20px, 3vw, 26px); font-weight: 900; color: #fff; cursor: pointer; font-family: inherit;
         letter-spacing: .1em; background: linear-gradient(135deg,#ff4f8b,#b04dff); box-shadow: 0 12px 34px rgba(255,79,139,.45);
         animation: pulse 1.6s ease-in-out infinite; transition: transform .12s, filter .12s; }
  .btn:hover { filter: brightness(1.15); } .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .btn.alt { background: rgba(255,255,255,.14); box-shadow: none; animation: none; padding: 14px 32px; font-size: 18px; }
  .howto { margin-top: 24px; font-size: clamp(12px, 1.8vw, 15px); line-height: 1.9; opacity: .85; font-weight: 700; }
  .howto b { display: inline-block; padding: 1px 8px; border-radius: 6px; background: rgba(255,255,255,.14); margin: 0 2px; font-family: inherit; }
  .howto .k0 { color: #ff4f8b; } .howto .k1 { color: #ffd23f; } .howto .k2 { color: #3dffb0; } .howto .k3 { color: #4fc3ff; }
  #pause { background: rgba(5,5,20,.6); backdrop-filter: blur(6px); }
  #pause .pz { font-size: clamp(48px, 10vw, 96px); font-weight: 900; letter-spacing: .3em; margin-bottom: 8px;
               background: linear-gradient(90deg,#fff,#8ed6ff,#fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 3s linear infinite; }
  #pause .hint { opacity: .7; font-size: 14px; margin-bottom: 20px; font-weight: 700; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ov">
  <div class="panel">
    <div class="logo-sub">RHYTHM STARS</div>
    <div class="logo">リズムスターズ</div>
    <div class="hiscore">HI-SCORE <span id="hiscore">0</span></div>
    <div class="diff-label">DIFFICULTY</div>
    <div class="diff" id="diff">
      <button class="d0" data-d="0">やさしい<small>EASY</small></button>
      <button class="d1" data-d="1">ふつう<small>NORMAL</small></button>
      <button class="d2" data-d="2">むずかしい<small>HARD</small></button>
    </div>
    <button class="btn" id="startBtn">スタート</button>
    <div class="howto">
      ⌨ <b class="k0">D</b><b class="k1">F</b><b class="k2">J</b><b class="k3">K</b> または <b class="k0">←</b><b class="k1">↓</b><b class="k2">↑</b><b class="k3">→</b> でノーツをたたけ！<br>
      📱 スマホ・タブレットは画面下の4つのボタンをタップ<br>
      ← → で難易度変更 ／ Enter・Space でスタート ／ Esc・P でポーズ
    </div>
  </div>
</div>

<div id="pause" class="ov hidden">
  <div class="panel">
    <div class="pz">PAUSE</div>
    <div class="hint">Esc / P でも再開できます</div>
    <div class="row">
      <button class="btn" id="resumeBtn">つづける</button>
      <button class="btn alt" id="quitBtn">タイトルへ</button>
    </div>
  </div>
</div>

<script src="../common.js"></script>
<script>
'use strict';
FES.init({ id: 'rhythm', title: 'リズムスターズ' });

/* =====================================================================
   定数
   ===================================================================== */
const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const LANES = 4;
const LANE_RGB = [[255, 79, 139], [255, 210, 63], [61, 255, 176], [79, 195, 255]];
const LANE_COLORS = ['#ff4f8b', '#ffd23f', '#3dffb0', '#4fc3ff'];
const KEY_LABELS = ['D', 'F', 'J', 'K'];
const ARROW_LABELS = ['←', '↓', '↑', '→'];
const KEY_TO_LANE = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
const BPM = 140, BEAT = 60 / BPM, STEP = BEAT / 4, BAR = BEAT * 4;
const COUNT_IN = 0.3 + BEAT * 4;             // ≒ 2.0 秒のカウントイン
const WIN = { PERFECT: 0.05, GREAT: 0.10, GOOD: 0.15 };
const JUDGES = {
  PERFECT: { score: 1000, gauge: 1.5, color: '#ffe36e', rgb: [255, 227, 110] },
  GREAT:   { score: 600,  gauge: 1.0, color: '#5ef1ff', rgb: [94, 241, 255] },
  GOOD:    { score: 300,  gauge: 0.5, color: '#8dff7a', rgb: [141, 255, 122] },
  MISS:    { score: 0,    gauge: -4,  color: '#ff6b6b', rgb: [255, 107, 107] },
};
const DIFFS = [
  { id: 'easy',   label: 'やさしい',   color: '#3dffb0', approach: 1.75, missGauge: -3 },
  { id: 'normal', label: 'ふつう',     color: '#ffd23f', approach: 1.45, missGauge: -4 },
  { id: 'hard',   label: 'むずかしい', color: '#ff4f8b', approach: 1.25, missGauge: -5 },
];

/* =====================================================================
   楽曲データ（A minor / 140 BPM / 38 小節 ≒ 65 秒）
   ===================================================================== */
const CH_A = [45, 41, 36, 43, 45, 41, 36, 43];   // Am F C G
const CH_B = [38, 45, 41, 43, 38, 45, 40, 40];   // Dm Am F G Dm Am E E
const MINOR_PC = { 9: true, 2: true };           // A, D はマイナー

// [step(16分), midi, 長さ(step)]
const MEL_A = [
  [[0, 69, 2], [2, 72, 2], [4, 76, 2], [6, 74, 2], [8, 72, 4], [12, 69, 2], [14, 71, 2]],
  [[0, 72, 4], [4, 69, 2], [6, 72, 2], [8, 77, 4], [12, 76, 4]],
  [[0, 76, 2], [2, 79, 2], [4, 76, 4], [8, 72, 2], [10, 74, 2], [12, 76, 4]],
  [[0, 74, 4], [4, 71, 4], [8, 74, 2], [10, 76, 2], [12, 74, 2], [14, 71, 2]],
  [[0, 69, 2], [2, 72, 2], [4, 76, 2], [6, 81, 2], [8, 79, 4], [12, 76, 4]],
  [[0, 77, 4], [4, 76, 2], [6, 72, 2], [8, 69, 4], [12, 72, 2], [14, 74, 2]],
  [[0, 76, 4], [4, 79, 2], [6, 76, 2], [8, 72, 4], [12, 67, 2], [14, 69, 2]],
  [[0, 71, 2], [2, 74, 2], [4, 79, 4], [8, 74, 4], [12, 71, 4]],
];
const MEL_B = [
  [[0, 74, 2], [2, 77, 2], [4, 81, 2], [6, 77, 2], [8, 74, 2], [10, 77, 2], [12, 81, 2], [14, 84, 2]],
  [[0, 84, 4], [4, 81, 4], [8, 76, 2], [10, 79, 2], [12, 81, 4]],
  [[0, 77, 2], [2, 81, 2], [4, 84, 2], [6, 81, 2], [8, 77, 4], [12, 76, 2], [14, 77, 2]],
  [[0, 79, 2], [2, 74, 2], [4, 83, 4], [8, 74, 4], [12, 79, 4]],
  [[0, 74, 2], [2, 77, 2], [4, 81, 2], [6, 77, 2], [8, 74, 2], [10, 77, 2], [12, 81, 2], [14, 84, 2]],
  [[0, 84, 4], [4, 83, 4], [8, 81, 2], [10, 79, 2], [12, 76, 2], [14, 72, 2]],
  [[0, 71, 2], [2, 76, 2], [4, 80, 4], [8, 83, 4], [12, 80, 4]],
  [[0, 83, 2], [2, 80, 2], [4, 76, 2], [6, 71, 2], [8, 76, 2], [10, 80, 2], [12, 83, 2], [14, 88, 2]],
];
const DRUMS = {
  light:  { k: 'x.......x.......', s: '................', h: '..x...x...x...x.' },
  basic:  { k: 'x...x...x...x...', s: '....x.......x...', h: 'x.x.x.x.x.x.x.o.' },
  groove: { k: 'x...x..x..x.x...', s: '....x.......x...', h: 'x.xxx.x.x.xxx.o.' },
  drive:  { k: 'x..x..x.x..x..x.', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx' },
  full:   { k: 'x...x..xx...x...', s: '....x.......x...', h: 'x.xxx.xxx.xxx.xo' },
};
const BASS = {
  light:  'r.......5.......',
  basic:  'r.r.R.r.r.r.R.5.',
  groove: 'r.rRr.r.R.rRr.5.',
  drive:  'rrrRrrrRrrrRrr5.',
  full:   'r.rRr.r.R.rRr.5R',
};
const SECTIONS = [
  { name: 'INTRO', bars: 4, chords: CH_A.slice(0, 4), mel: null,  drums: 'light',  bass: 'light',  pad: true,  riser: true },
  { name: 'A1',    bars: 8, chords: CH_A, mel: MEL_A, drums: 'basic',  bass: 'basic',  pad: false, fill: true },
  { name: 'A2',    bars: 8, chords: CH_A, mel: MEL_A, drums: 'groove', bass: 'groove', pad: true,  fill: true, echo: true },
  { name: 'B',     bars: 8, chords: CH_B, mel: MEL_B, drums: 'drive',  bass: 'drive',  pad: true,  fill: true },
  { name: 'A3',    bars: 8, chords: CH_A, mel: MEL_A, drums: 'full',   bass: 'full',   pad: true,  bigfill: true, octave: true },
  { name: 'OUTRO', bars: 2, chords: [45, 45], mel: null, drums: null, bass: null, pad: false, outro: true },
];
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

/** 楽曲イベント列と譜面素材（メロディ/ドラム）を決定論的に生成 */
function buildSong() {
  const ev = [], mel = [], drums = [], sections = [];
  let bar0 = 0;
  SECTIONS.forEach((S, si) => {
    sections.push({ name: S.name, start: bar0 * BAR, end: (bar0 + S.bars) * BAR });
    for (let b = 0; b < S.bars; b++) {
      const barT = (bar0 + b) * BAR;
      const root = S.chords[b % S.chords.length];
      const isLast = b === S.bars - 1;
      if (S.drums) {
        const D = DRUMS[S.drums];
        for (let s = 0; s < 16; s++) {
          const t = barT + s * STEP;
          let k = D.k[s], sn = D.s[s], h = D.h[s], snVol = 1;
          if (S.fill && isLast && s >= 8) sn = '........x.x.xxxx'[s];
          if (S.bigfill && isLast && s >= 8) { sn = 'x'; k = s % 4 === 0 ? 'x' : '.'; h = '.'; snVol = 0.45 + (s - 8) * 0.08; }
          if (k === 'x') { ev.push({ t, kind: 'kick' }); drums.push({ t, kind: 'kick', sec: si, bar: b, step: s }); }
          if (sn === 'x') { ev.push({ t, kind: 'snare', vol: snVol }); drums.push({ t, kind: 'snare', sec: si, bar: b, step: s }); }
          if (h === 'x' || h === 'o') ev.push({ t, kind: 'hat', open: h === 'o', vol: s % 2 === 0 ? 1 : 0.55 });
        }
      }
      if (S.riser && isLast) {
        ev.push({ t: barT, kind: 'riser', dur: BAR });
        for (let s = 8; s < 16; s++) {
          const t = barT + s * STEP;
          ev.push({ t, kind: 'snare', vol: 0.3 + (s - 8) * 0.09 });
          drums.push({ t, kind: 'snare', sec: si, bar: b, step: s });
        }
      }
      if (S.bass) {
        const P = BASS[S.bass];
        for (let s = 0; s < 16; s++) {
          const c = P[s]; if (c === '.') continue;
          let len = 1; while (s + len < 16 && P[s + len] === '.') len++;
          const midi = c === 'r' ? root : c === 'R' ? root + 12 : root + 7;
          const maxLen = S.bass === 'light' ? 8 : 2;
          ev.push({ t: barT + s * STEP, kind: 'bass', midi, dur: Math.min(len, maxLen) * STEP * 0.85 });
        }
      }
      if (S.mel) {
        S.mel[b].forEach(n => {
          const t = barT + n[0] * STEP, midi = n[1], dur = n[2] * STEP * 0.9;
          ev.push({ t, kind: 'lead', midi, dur, vol: 1 });
          if (S.octave) ev.push({ t, kind: 'lead', midi: midi - 12, dur, vol: 0.4 });
          if (S.echo) ev.push({ t: t + STEP * 3, kind: 'lead', midi: midi + 12, dur: dur * 0.6, vol: 0.16 });
          mel.push({ t, midi, sec: si, bar: b, step: n[0] });
        });
      }
      if (S.pad) ev.push({ t: barT, kind: 'pad', root, dur: BAR });
      if (S.outro) {
        if (b === 0) {
          ev.push({ t: barT, kind: 'kick' }); ev.push({ t: barT, kind: 'crash' });
          ev.push({ t: barT, kind: 'bass', midi: 33, dur: BAR * 1.8 });
          [69, 72, 76, 81].forEach(m => ev.push({ t: barT, kind: 'lead', midi: m, dur: BAR * 1.8, vol: 0.45 }));
          ev.push({ t: barT, kind: 'pad', root: 45, dur: BAR * 2 });
        } else {
          ev.push({ t: barT, kind: 'kick' }); ev.push({ t: barT + BEAT * 2, kind: 'kick' });
          ev.push({ t: barT + BEAT, kind: 'hat', open: true, vol: 0.8 });
        }
      }
    }
    bar0 += S.bars;
  });
  ev.sort((a, b) => a.t - b.t);
  return { events: ev, mel, drums, sections, length: bar0 * BAR };
}
const SONG = buildSong();

/** 難易度別の譜面を楽曲から決定論的に生成 */
function buildChart(diffId) {
  const notes = [];
  const add = (t, lane) => notes.push({ t, lane, state: 0, judge: null, chord: false });
  // セクションごとに「使われている音高の順位」でレーンを決める（音の高低＝左右、階段が自然に生まれる）
  const laneMaps = {};
  SECTIONS.forEach((S, i) => {
    if (!S.mel) return;
    const set = new Set();
    S.mel.forEach(bar => bar.forEach(n => set.add(n[1])));
    const sorted = Array.from(set).sort((a, b) => a - b);
    const map = {};
    sorted.forEach((m, k) => { map[m] = FES.clamp(Math.floor(k / sorted.length * LANES), 0, LANES - 1); });
    laneMaps[i] = map;
  });
  const pitchLane = (midi, si) => laneMaps[si][midi];
  const A3 = SONG.sections[4];
  const streamStart = A3.end - BAR / 2;     // A3 最終小節の後半は階段ゾーン

  SONG.mel.forEach(m => {
    if (m.t >= streamStart) return;
    const S = SECTIONS[m.sec];
    if (diffId === 'easy') {
      const ok = m.step % 4 === 0 || (S.name === 'A3' && m.step % 2 === 0) || (S.name === 'B' && m.bar >= 4 && m.step % 2 === 0);
      if (!ok) return;
    }
    add(m.t, pitchLane(m.midi, m.sec));
  });

  SONG.drums.forEach(d => {
    if (d.t >= streamStart) return;
    const S = SECTIONS[d.sec];
    const outer = d.bar % 2 === 0 ? 0 : 3;
    if (S.name === 'INTRO') {
      if (d.kind === 'kick') add(d.t, diffId === 'hard' ? outer : [1, 2, 0, 3][d.bar % 4]);
      else if (diffId === 'easy') { if (d.step === 8 || d.step === 12) add(d.t, d.step === 8 ? 1 : 2); }
      else if (diffId === 'normal') { if (d.step >= 8 && d.step % 2 === 0) add(d.t, (d.step / 2) % 2 === 0 ? 1 : 2); }
      else add(d.t, d.step % 2 === 0 ? 1 : 2);
      return;
    }
    if (diffId === 'easy') return;
    if (diffId === 'normal') {
      if (d.kind === 'kick' && d.step === 0 && S.name !== 'A1') add(d.t, outer);
      if (d.kind === 'snare' && d.step === 12 && (S.name === 'B' || S.name === 'A3')) add(d.t, 3 - outer);
      if (d.kind === 'snare' && S.name === 'B' && d.bar === 7 && d.step >= 8 && d.step % 2 === 0) add(d.t, 3 - outer);
      return;
    }
    // hard
    if (d.kind === 'kick') {
      if (S.name === 'A1') { if (d.step === 0) add(d.t, outer); }
      else if (S.name === 'A2') { if (d.step === 0 || d.step === 8) add(d.t, outer); }
      else add(d.t, outer);
    }
    if (d.kind === 'snare' && S.name !== 'A1') add(d.t, 3 - outer);
  });

  // 終盤の階段
  if (diffId === 'hard') for (let i = 0; i < 8; i++) add(streamStart + i * STEP, i % 4);
  else if (diffId === 'normal') for (let i = 0; i < 4; i++) add(streamStart + i * 2 * STEP, i);
  else for (let i = 0; i < 2; i++) add(streamStart + i * 4 * STEP, 1 + i);
  // ラストの一撃
  const fin = SONG.sections[5].start;
  (diffId === 'hard' ? [0, 1, 2, 3] : diffId === 'normal' ? [0, 3] : [1, 2]).forEach(l => add(fin, l));

  notes.sort((a, b) => a.t - b.t || a.lane - b.lane);
  const out = []; const lastT = [-9, -9, -9, -9];
  notes.forEach(n => { if (n.t - lastT[n.lane] < 0.09) return; lastT[n.lane] = n.t; out.push(n); });
  for (let i = 0; i < out.length; i++) {
    let j = i + 1;
    while (j < out.length && Math.abs(out[j].t - out[i].t) < 1e-6) j++;
    if (j - i >= 2) { for (let k = i; k < j; k++) { out[k].chord = true; out[k].chordLo = out[i].lane; out[k].chordHi = out[j - 1].lane; } i = j - 1; }
  }
  return out;
}

/* =====================================================================
   音楽エンジン（WebAudio ルックアヘッド・スケジューラ）
   ===================================================================== */
const Music = (() => {
  const LOOKAHEAD = 0.25;
  let ac = null, out = null, noiseBuf = null;
  let songStart = 0, idx = 0, timer = null, active = [], playing = false, lastMuted = null;

  function setup() {
    const a = FES.audioContext();
    if (!a) return false;
    if (a !== ac) {
      ac = a;
      out = ac.createGain(); out.gain.value = 0.55; out.connect(ac.destination);
      const len = ac.sampleRate;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return true;
  }
  const track = (node, end) => { active.push({ n: node, end }); };
  function gainEnv(t, a, peak, d, end) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    if (d != null) g.gain.exponentialRampToValueAtTime(Math.max(0.0002, d), end);
    g.connect(out);
    return g;
  }
  function noiseSrc(t, dur) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    s.start(t); s.stop(t + dur + 0.05); track(s, t + dur + 0.1);
    return s;
  }
  const V = {
    kick(t) {
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      const g = gainEnv(t, 0.003, 0.5, 0.0001, t + 0.3);
      o.connect(g); o.start(t); o.stop(t + 0.32); track(o, t + 0.35);
      const c = noiseSrc(t, 0.02); const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000;
      const cg = gainEnv(t, 0.001, 0.12, 0.0001, t + 0.02); c.connect(f); f.connect(cg);
    },
    snare(t, e) {
      const v = e.vol == null ? 1 : e.vol;

      const g = gainEnv(t, 0.002, 0.24 * v, 0.0001, t + 0.17); s.connect(f); f.connect(g);
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.07);
      const og = gainEnv(t, 0.002, 0.16 * v, 0.0001, t + 0.09); o.connect(og); o.start(t); o.stop(t + 0.1); track(o, t + 0.12);

      const s = noiseSrc(t, dur); const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000;
      const g = gainEnv(t, 0.001, 0.075 * v, 0.0001, t + dur); s.connect(f); f.connect(g);

    bass(t, e) {

      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 5;
      f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(260, t + Math.max(0.08, dur));

    },

  };

  function schedule() {
    if (!playing || !ac) return;
    const now = ac.currentTime;
    if (active.length > 40) active = active.filter(a => a.end > now);
    const ev = SONG.events;
    while (idx < ev.length && ev[idx].t + songStart < now + LOOKAHEAD) {
      const e = ev[idx++];
      const t = Math.max(now + 0.005, e.t + songStart);
      const fn = V[e.kind];

    active = [];

  function seek(songTime, newStart) {
    stopAll();
    songStart = newStart;
    const ev = SONG.events;
    idx = 0;
    while (idx < ev.length && ev[idx].t < songTime - 0.02) idx++;
  }

  return {
    setup,
    ctx: () => ac,
    start(startAbs) {
      if (!ac) return;
      seek(-99, startAbs); playing = true;
      clearInterval(timer); timer = setInterval(schedule, 25); schedule();
    },
    resume(songTime, newStart) {
      if (!ac) return;
      seek(songTime, newStart); playing = true;
      clearInterval(timer); timer = setInterval(schedule, 25); schedule();

    stop() { playing = false; clearInterval(timer); timer = null; stopAll(); },
    tick() {
      if (!out) return;

      if (m !== lastMuted) { out.gain.value = m ? 0 : 0.55; lastMuted = m; }
    },
  };
})();

/* ---------- レイアウト ---------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  L.W = window.innerWidth; L.H = window.innerHeight;
  canvas.width = Math.floor(L.W * dpr); canvas.height = Math.floor(L.H * dpr);
  canvas.style.width = L.W + 'px'; canvas.style.height = L.H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  L.portrait = L.H > L.W;
  L.cx = L.W / 2;
  L.topY = L.portrait ? L.H * 0.15 : L.H * 0.13;
  L.judgeY = L.portrait ? L.H * 0.70 : L.H * 0.76;
  L.botW = L.portrait ? Math.min(L.W * 0.94, 560) : FES.clamp(L.H * 0.85, 300, L.W * 0.9);
  L.topW = L.botW * 0.36;
  L.padTop = L.judgeY + (L.portrait ? 34 : 24);
  L.padBot = L.H - (L.portrait ? 18 : 12);
  L.vis = !L.portrait && (L.W - L.botW) / 2 > 150;
}
function laneEdges(y) {
  const f = FES.clamp((y - L.topY) / (L.judgeY - L.topY), 0, 1.25);
  const w = L.topW + (L.botW - L.topW) * f;
  return { left: L.cx - w / 2, w };
}
function laneX(lane, y) { const e = laneEdges(y); return [e.left + e.w * lane / LANES, e.left + e.w * (lane + 1) / LANES]; }
function laneCenter(lane, y) { const x = laneX(lane, y); return (x[0] + x[1]) / 2; }
function noteY(t, st) { return L.topY + (1 - (t - st) / approach()) * (L.judgeY - L.topY); }
function laneAtX(x) {
  const left = L.cx - L.botW / 2;
  return FES.clamp(Math.floor((x - left) / (L.botW / LANES)), 0, LANES - 1);
}

/* ---------- 描画ヘルパ ---------- */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function glowText(text, x, y, size, color, glow, weight, blur) {
  ctx.font = `${weight || 900} ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = glow; ctx.shadowBlur = blur == null ? size * 0.5 : blur;
  ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.shadowBlur = 0;
}
function fillText(text, x, y, size, color, weight, align) {
  ctx.font = `${weight || 900} ${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

/* =====================================================================
   判定
   ===================================================================== */
function hitLane(lane) {
  FX.press[lane] = 1;
  if (G.state !== 'play' && G.state !== 'countin') return;
  const st = songTime();
  let best = -1;
  for (let i = G.nextIdx; i < G.notes.length; i++) {
    const n = G.notes[i];
    if (n.t > st + WIN.GOOD) break;
    if (n.state !== 0 || n.lane !== lane) continue;
    best = i; break;
  }
  if (best < 0) { FX.flash[lane] = Math.max(FX.flash[lane], 0.3); return; }
  const n = G.notes[best];
  const d = st - n.t, ad = Math.abs(d);
  applyJudge(n, ad <= WIN.PERFECT ? 'PERFECT' : ad <= WIN.GREAT ? 'GREAT' : 'GOOD', d);
}
function applyJudge(n, j, delta) {
  n.state = j === 'MISS' ? 2 : 1; n.judge = j;
  G.counts[j]++;
  const now = performance.now() / 1000;
  const J = JUDGES[j];
  if (j === 'MISS') {
    G.combo = 0;
    G.gauge = Math.max(0, G.gauge + DIFFS[G.diff].missGauge);
    FX.shake = Math.max(FX.shake, 5); FX.gaugeFlash = 1;
    FES.tone({ freq: 220, slide: 110, dur: 0.14, type: 'sawtooth', vol: 0.12 });
    if (G.gauge <= 0 && !G.failed) { G.failed = true; G.endAt = now + 1.2; FES.sfx('gameover'); Music.stop(); }
  } else {
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    const mult = 1 + Math.min(Math.floor(G.combo / 10), 10) * 0.1;
    G.score += Math.round(J.score * mult);
    G.gauge = Math.min(100, G.gauge + J.gauge);
    if (j === 'PERFECT') { FES.tone({ freq: 1568, dur: 0.06, type: 'triangle', vol: 0.22 }); FES.tone({ freq: 2093, dur: 0.1, delay: 0.03, type: 'sine', vol: 0.14 }); }
    else if (j === 'GREAT') FES.tone({ freq: 1175, dur: 0.06, type: 'triangle', vol: 0.2 });
    else FES.tone({ freq: 784, dur: 0.07, type: 'triangle', vol: 0.18 });
    if (G.combo % 10 === 0) FES.sfx('combo');
    if (G.combo % 50 === 0) {
      FX.shake = Math.max(FX.shake, 8);
      FX.texts.push({ text: G.combo === 50 ? 'FEVER!!' : G.combo % 100 === 0 ? `${G.combo} COMBO!! SUPER!` : `${G.combo} COMBO!`, t: now, color: G.combo >= 100 ? '#ff4f8b' : '#ffd23f' });
      FES.sfx('powerup');
    }
    spawnHit(n.lane, j);
  }
  FX.judge = { text: j, color: J.color, rgb: J.rgb, t: now, delta };
  FX.comboPop = 1;
  while (G.nextIdx < G.notes.length && G.notes[G.nextIdx].state !== 0) G.nextIdx++;
}
function spawnHit(lane, j) {
  const x = laneCenter(lane, L.judgeY), y = L.judgeY;
  const col = LANE_RGB[lane], jc = JUDGES[j].rgb;
  const count = j === 'PERFECT' ? 22 : j === 'GREAT' ? 14 : 8;
  const w = laneX(lane, L.judgeY); const lw = w[1] - w[0];
  for (let i = 0; i < count; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
    const sp = 180 + Math.random() * 420;
    FX.particles.push({ x: x + (Math.random() - 0.5) * lw * 0.6, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45 + Math.random() * 0.35, age: 0,
      s: 2 + Math.random() * 4, c: Math.random() < 0.6 ? col : jc, sq: Math.random() < 0.4 });
  }
  FX.rings.push({ x, y, t: 0, c: col, max: lw * (j === 'PERFECT' ? 1.1 : 0.7) });
  FX.flash[lane] = 1;
}

/* =====================================================================
   更新
   ===================================================================== */
function update(dt, now) {
  Music.tick();
  const dec = k => Math.max(0, k - dt);
  for (let l = 0; l < LANES; l++) { FX.flash[l] = Math.max(0, FX.flash[l] - dt * 4); if (!isPressedByPointer(l)) FX.press[l] = Math.max(0, FX.press[l] - dt * 8); }
  FX.comboPop = Math.max(0, FX.comboPop - dt * 5);
  FX.shake = Math.max(0, FX.shake - dt * 30);
  FX.gaugeFlash = dec(FX.gaugeFlash * 2) / 2;
  VIS.kick *= Math.pow(0.02, dt); VIS.snare *= Math.pow(0.03, dt); VIS.hat *= Math.pow(0.001, dt); VIS.bass *= Math.pow(0.05, dt); VIS.lead *= Math.pow(0.08, dt);
  STARS.forEach(s => { s.y += s.v * dt; if (s.y > 1.02) { s.y = -0.02; s.x = Math.random(); } });

  // 目標値
  G.fever = G.combo >= 100 ? 2 : G.combo >= 50 ? 1 : 0;
  G.feverAmt += (G.fever - G.feverAmt) * Math.min(1, dt * 3);
  G.dispScore += (G.score - G.dispScore) * Math.min(1, dt * 10);
  if (Math.abs(G.score - G.dispScore) < 1) G.dispScore = G.score;

  // パーティクル
  const P = FX.particles; let w = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i]; p.age += dt; if (p.age >= p.life) continue;
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.2, dt);
    P[w++] = p;
  }
  P.length = w;
  const R = FX.rings; w = 0;
  for (let i = 0; i < R.length; i++) { const r = R[i]; r.t += dt; if (r.t < 0.4) R[w++] = r; }
  R.length = w;
  const T = FX.texts; w = 0;
  for (let i = 0; i < T.length; i++) { if (now - T[i].t < 1.3) T[w++] = T[i]; }
  T.length = w;

  if (G.state === 'title' || G.state === 'pause') {
    if (G.state === 'title') idleVis(now);
    return;
  }
  const st = songTime();

  // ビジュアライザー用の音イベント
  const ev = SONG.events;
  while (G.visIdx < ev.length && ev[G.visIdx].t <= st) {
    const e = ev[G.visIdx++];
    if (e.kind === 'kick') VIS.kick = 1; else if (e.kind === 'snare') VIS.snare = Math.max(VIS.snare, e.vol == null ? 1 : e.vol);
    else if (e.kind === 'hat') VIS.hat = 1; else if (e.kind === 'bass') VIS.bass = 1; else if (e.kind === 'lead') VIS.lead = Math.max(VIS.lead, e.vol == null ? 1 : e.vol);
    else if (e.kind === 'crash') { VIS.snare = 1; VIS.hat = 1; FX.shake = Math.max(FX.shake, 10); }
  }
  updateBands(dt, now);

  if (G.state === 'countin') {
    const stages = [{ at: -3 * BEAT, txt: '3' }, { at: -2 * BEAT, txt: '2' }, { at: -BEAT, txt: '1' }, { at: 0, txt: 'GO!' }];
    while (G.countStage < stages.length && st >= stages[G.countStage].at) {
      const s = stages[G.countStage++];
      FX.count = { text: s.txt, t: now };
      FES.sfx(s.txt === 'GO!' ? 'go' : 'countdown');
      if (s.txt === 'GO!') G.state = 'play';
    }
  }
  if (G.state === 'play' || G.state === 'countin') {
    // 自動 MISS（ゲージ切れ後は数えない）
    if (!G.failed) {
      for (let i = G.nextIdx; i < G.notes.length; i++) {
        const n = G.notes[i];
        if (n.t >= st - WIN.GOOD) break;
        if (n.state === 0) applyJudge(n, 'MISS', 0);
      }
    }
    while (G.drawIdx < G.notes.length && G.notes[G.drawIdx].t < st - 0.6) G.drawIdx++;
    if (G.failed && now >= G.endAt) finishGame();
    else if (!G.failed && st > SONG.length + 1.2) finishGame();
  }
}
function isPressedByPointer(lane) { for (const v of pointers.values()) if (v === lane) return true; return false; }
function updateBands(dt, now) {
  const B = VIS.bands, n = B.length;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const low = Math.max(0, 1 - f * 2.2), mid = Math.max(0, 1 - Math.abs(f - 0.5) * 3), high = Math.max(0, (f - 0.5) * 2);
    const target = low * (VIS.kick * 0.9 + VIS.bass * 0.5) + mid * (VIS.lead * 0.8 + VIS.snare * 0.4) + high * (VIS.hat * 0.7 + VIS.snare * 0.6)
      + 0.08 + 0.05 * Math.sin(now * 5 + i);
    B[i] = target > B[i] ? target : B[i] + (target - B[i]) * Math.min(1, dt * 8);
  }
}
function idleVis(now) {
  const beat = (now / BEAT) % 1;
  if (beat < 0.05) VIS.kick = Math.max(VIS.kick, 0.6);
}

/* =====================================================================
   描画
   ===================================================================== */
function render(now) {
  const st = G.state === 'title' ? now : songTime();
  ctx.save();
  if (FX.shake > 0.2) ctx.translate((Math.random() - 0.5) * FX.shake, (Math.random() - 0.5) * FX.shake);
  drawBackground(st, now);
  drawLanes(now);
  if (G.state !== 'title') drawNotes(st);
  drawEffects(now);
  drawPads(now);
  ctx.restore();
  if (G.state !== 'title') drawHUD(now);
  drawCenterText(now);
}

function drawBackground(st, now) {
  const W = L.W, H = L.H, fv = G.feverAmt;
  const hue = (now * 55) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (fv > 0.02) {
    g.addColorStop(0, `hsl(${hue},65%,${5 + fv * 4}%)`); g.addColorStop(1, `hsl(${(hue + 90) % 360},70%,${9 + fv * 6}%)`);
  } else { g.addColorStop(0, '#05041a'); g.addColorStop(1, '#140a3c'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const horizon = L.topY - 6;
  const pulse = VIS.kick;
  // 地平線グロー
  const rg = ctx.createRadialGradient(L.cx, horizon, 0, L.cx, horizon, W * 0.55);
  rg.addColorStop(0, fv > 0.02 ? `hsla(${(hue + 40) % 360},90%,65%,${0.3 + pulse * 0.35})` : `rgba(130,90,255,${0.28 + pulse * 0.3})`);
  rg.addColorStop(0.5, 'rgba(60,20,120,0.08)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // 星
  for (let i = 0; i < STARS.length; i++) {
    const s = STARS[i];
    const tw = 0.45 + 0.55 * Math.sin(now * 3 + s.p);
    const sz = s.s * (1 + pulse * 0.6);
    ctx.fillStyle = `rgba(255,255,255,${(0.35 + 0.5 * tw).toFixed(2)})`;
    ctx.fillRect(s.x * W - sz / 2, s.y * H - sz / 2, sz, sz);
  }

  // フィーバー時のビーム
  if (fv > 0.02) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const rays = 10;
    for (let i = 0; i < rays; i++) {
      const a = now * 0.5 * (i % 2 ? 1 : -1) + i * Math.PI * 2 / rays;
      const len = H * 1.6, wd = 0.05 + 0.02 * Math.sin(now * 2 + i);
      ctx.fillStyle = `hsla(${(hue + i * 36) % 360},100%,65%,${0.05 * fv})`;
      ctx.beginPath(); ctx.moveTo(L.cx, horizon);
      ctx.lineTo(L.cx + Math.cos(a - wd) * len, horizon + Math.sin(a - wd) * len);
      ctx.lineTo(L.cx + Math.cos(a + wd) * len, horizon + Math.sin(a + wd) * len);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // 透視グリッド（拍に同期して手前へ流れる）
  const beat = ((st / BEAT) % 1 + 1) % 1;
  const rows = 14;
  ctx.lineWidth = 1;
  const gridCol = z => fv > 0.02 ? `hsla(${(hue + 180 + z * 120) % 360},100%,70%,` : 'rgba(150,110,255,';
  for (let k = 0; k < rows; k++) {
    const z = (k + beat) / rows;
    const y = horizon + (H - horizon) * z * z;
    const a = (0.05 + 0.45 * z) * (0.55 + 0.45 * pulse);
    ctx.strokeStyle = gridCol(z) + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = -9; i <= 9; i++) {
    const xb = L.cx + i * (W / 7);
    const a = 0.05 + 0.1 * (1 - Math.abs(i) / 10) + pulse * 0.08;
    ctx.strokeStyle = gridCol(0.5) + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(L.cx, horizon); ctx.lineTo(xb, H); ctx.stroke();
  }

  // ビジュアライザー（横幅に余裕があるとき）
  if (L.vis) {
    const n = VIS.bands.length;
    const region = (W - L.botW) / 2 - 60;
    const bw = region / n;
    const maxH = (L.judgeY - L.topY) * 0.55;
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < n; i++) {
        const e = FES.clamp(VIS.bands[i], 0, 1.2);
        const h = 6 + e * maxH;
        const x = side === 0 ? 30 + i * bw : W - 30 - (i + 1) * bw;
        const c = LANE_RGB[(i + side * 2) % 4];
        const gg = ctx.createLinearGradient(0, L.judgeY - h, 0, L.judgeY);
        gg.addColorStop(0, rgba(c, 0.85)); gg.addColorStop(1, rgba(c, 0.08));
        ctx.fillStyle = gg;
        rr(x + 2, L.judgeY - h, bw - 4, h, 3); ctx.fill();
      }
    }
  }
}

function drawLanes(now) {
  const top = laneEdges(L.topY), bot = laneEdges(L.padBot);
  // レーン背景
  ctx.fillStyle = 'rgba(3,2,18,0.74)';
  ctx.beginPath(); ctx.moveTo(top.left, L.topY); ctx.lineTo(top.left + top.w, L.topY); ctx.lineTo(bot.left + bot.w, L.padBot); ctx.lineTo(bot.left, L.padBot); ctx.closePath(); ctx.fill();
  // レーンフラッシュ
  for (let l = 0; l < LANES; l++) {
    const f = Math.max(FX.flash[l], FX.press[l] * 0.35);
    if (f <= 0.01) continue;
    const a = laneX(l, L.topY), b = laneX(l, L.judgeY);
    const gg = ctx.createLinearGradient(0, L.topY, 0, L.judgeY);
    gg.addColorStop(0, rgba(LANE_RGB[l], 0)); gg.addColorStop(1, rgba(LANE_RGB[l], 0.55 * f));
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(a[0], L.topY); ctx.lineTo(a[1], L.topY); ctx.lineTo(b[1], L.judgeY); ctx.lineTo(b[0], L.judgeY); ctx.closePath(); ctx.fill();
  }
  // レーン区切り線（ネオン）
  for (let i = 0; i <= LANES; i++) {
    const xt = top.left + top.w * i / LANES, xb = bot.left + bot.w * i / LANES;
    const outer = i === 0 || i === LANES;
    ctx.strokeStyle = outer ? 'rgba(200,180,255,0.7)' : 'rgba(180,160,255,0.22)';
    ctx.lineWidth = outer ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(xt, L.topY); ctx.lineTo(xb, L.padBot); ctx.stroke();
    if (outer) {
      ctx.strokeStyle = 'rgba(160,120,255,0.25)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(xt, L.topY); ctx.lineTo(xb, L.padBot); ctx.stroke();
    }
  }
  // 判定ライン
  const je = laneEdges(L.judgeY);
  const jg = ctx.createLinearGradient(0, L.judgeY - 18, 0, L.judgeY + 18);
  jg.addColorStop(0, 'rgba(255,255,255,0)'); jg.addColorStop(0.5, `rgba(255,255,255,${0.22 + VIS.kick * 0.2})`); jg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = jg; ctx.fillRect(je.left, L.judgeY - 18, je.w, 36);
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(je.left, L.judgeY - 1.5, je.w, 3);
  // レセプター
  for (let l = 0; l < LANES; l++) {
    const x = laneX(l, L.judgeY), w = x[1] - x[0];
    const p = FX.press[l];
    const h = 22 + p * 6;
    rr(x[0] + w * 0.08, L.judgeY - h / 2, w * 0.84, h, 8);
    ctx.fillStyle = rgba(LANE_RGB[l], 0.12 + p * 0.55); ctx.fill();
    ctx.strokeStyle = rgba(LANE_RGB[l], 0.6 + p * 0.4); ctx.lineWidth = 2 + p * 2; ctx.stroke();
  }
  void now;
}

function drawNotes(st) {
  const notes = G.notes, ap = approach();
  const range = L.judgeY - L.topY;
  ctx.lineWidth = 1;
  // 同時押しの連結線
  for (let i = G.drawIdx; i < notes.length; i++) {
    const n = notes[i];
    if (n.t - st > ap * 1.1) break;
    if (!n.chord || n.state !== 0 || n.lane !== n.chordLo) continue;
    const y = noteY(n.t, st);
    if (y < L.topY - 40 || y > L.judgeY + 60) continue;
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(laneCenter(n.chordLo, y), y); ctx.lineTo(laneCenter(n.chordHi, y), y); ctx.stroke();
  }
  for (let i = G.drawIdx; i < notes.length; i++) {
    const n = notes[i];
    if (n.t - st > ap * 1.1) break;
    if (n.state === 1) continue;
    const y = noteY(n.t, st);
    if (y < L.topY - 30) continue;
    const f = (y - L.topY) / range;
    if (f > 1.25) continue;
    let alpha = 1, c = LANE_RGB[n.lane];
    if (n.state === 2) { alpha = FES.clamp(1 - (st - n.t - WIN.GOOD) / 0.3, 0, 1) * 0.8; c = [140, 140, 160]; }
    else if (f < 0.12) alpha = FES.clamp((f + 0.05) / 0.17, 0, 1);
    if (alpha <= 0) continue;
    const x = laneX(n.lane, y), w = x[1] - x[0];
    const h = 8 + 16 * FES.clamp(f, 0, 1.2);
    const nx = x[0] + w * 0.07, nw = w * 0.86;
    // グロー
    ctx.fillStyle = rgba(c, 0.22 * alpha);
    rr(nx - 4, y - h, nw + 8, h * 2, h); ctx.fill();
    // 本体
    const gg = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    gg.addColorStop(0, `rgba(255,255,255,${alpha})`); gg.addColorStop(0.35, rgba(c, alpha)); gg.addColorStop(1, rgba([c[0] * 0.55, c[1] * 0.55, c[2] * 0.55], alpha));
    ctx.fillStyle = gg;
    rr(nx, y - h / 2, nw, h, h / 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * alpha})`; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function drawEffects(now) {
  const P = FX.particles;
  for (let i = 0; i < P.length; i++) {
    const p = P[i], k = 1 - p.age / p.life;
    ctx.fillStyle = rgba(p.c, k);
    const s = p.s * (0.5 + k);
    if (p.sq) ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, s / 2, 0, 6.2832); ctx.fill(); }
  }
  for (let i = 0; i < FX.rings.length; i++) {
    const r = FX.rings[i], k = r.t / 0.4;
    ctx.strokeStyle = rgba(r.c, (1 - k) * 0.9); ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.max * (0.2 + k * 0.8), r.max * (0.2 + k * 0.8) * 0.45, 0, 0, 6.2832); ctx.stroke();
  }
  if (G.state === 'title') return;
  // 判定テキスト
  const jy = L.judgeY - (L.judgeY - L.topY) * 0.30;
  if (FX.judge) {
    const age = now - FX.judge.t;
    if (age < 0.7) {
      const sc = age < 0.08 ? 1.5 - age / 0.08 * 0.5 : 1;
      const a = age > 0.5 ? 1 - (age - 0.5) / 0.2 : 1;
      const size = Math.min(44, L.botW * 0.09) * sc;
      ctx.save(); ctx.globalAlpha = a;
      if (FX.judge.text === 'PERFECT') {
        const gg = ctx.createLinearGradient(L.cx - 100, 0, L.cx + 100, 0);
        const hh = (now * 300) % 360;
        gg.addColorStop(0, `hsl(${hh},100%,75%)`); gg.addColorStop(0.5, '#fff'); gg.addColorStop(1, `hsl(${(hh + 120) % 360},100%,75%)`);
        glowText('PERFECT', L.cx, jy, size, gg, '#ffe36e');
      } else {
        glowText(FX.judge.text, L.cx, jy, size, FX.judge.color, FX.judge.color);
      }
      if (FX.judge.text !== 'PERFECT' && FX.judge.text !== 'MISS') {
        const early = FX.judge.delta < 0;
        fillText(early ? 'EARLY' : 'LATE', L.cx, jy + size * 0.8, size * 0.36, early ? '#7fb8ff' : '#ffa26b', 900);
      }
      ctx.restore();
    }
  }
  // コンボ
  if (G.combo >= 3) {
    const cy = L.judgeY - (L.judgeY - L.topY) * 0.52;
    const sc = 1 + FX.comboPop * 0.28;
    const size = Math.min(72, L.botW * 0.15) * sc;
    let color = '#ffffff', glow = 'rgba(255,255,255,0.6)';
    if (G.combo >= 100) { color = `hsl(${(now * 200) % 360},100%,70%)`; glow = color; }
    else if (G.combo >= 50) { color = '#ffd23f'; glow = '#ff9a3f'; }
    glowText(String(G.combo), L.cx, cy, size, color, glow, 900, size * 0.4);
    fillText('COMBO', L.cx, cy + size * 0.62, size * 0.28, 'rgba(255,255,255,0.8)', 800);
  }
  // 浮遊テキスト
  for (let i = 0; i < FX.texts.length; i++) {
    const t = FX.texts[i], age = now - t.t;
    const a = age < 0.15 ? age / 0.15 : age > 0.9 ? Math.max(0, 1 - (age - 0.9) / 0.4) : 1;
    const sc = age < 0.15 ? 0.6 + age / 0.15 * 0.5 : 1.1 - Math.min(0.1, (age - 0.15) * 0.3);
    ctx.save(); ctx.globalAlpha = a;
    glowText(t.text, L.cx, L.topY + (L.judgeY - L.topY) * 0.14 - age * 25, Math.min(40, L.botW * 0.085) * sc, t.color, t.color);
    ctx.restore();
  }
}

function drawPads(now) {
  const ph = L.padBot - L.padTop;
  if (ph < 24) return;
  for (let l = 0; l < LANES; l++) {
    const x = laneX(l, L.judgeY), w = x[1] - x[0];
    const p = FX.press[l];
    const inset = 5, sc = 1 - p * 0.05;
    const pw = (w - inset * 2) * sc, phh = ph * sc;
    const px = x[0] + inset + (w - inset * 2 - pw) / 2, py = L.padTop + (ph - phh) / 2;
    const c = LANE_RGB[l];
    const gg = ctx.createLinearGradient(0, py, 0, py + phh);
    gg.addColorStop(0, rgba(c, 0.12 + p * 0.6)); gg.addColorStop(1, rgba(c, 0.05 + p * 0.3));
    rr(px, py, pw, phh, 14); ctx.fillStyle = gg; ctx.fill();
    ctx.strokeStyle = rgba(c, 0.55 + p * 0.45); ctx.lineWidth = 2 + p * 2; ctx.stroke();
    const fs = Math.min(phh * 0.42, pw * 0.36, 44);
    fillText(KEY_LABELS[l], px + pw / 2, py + phh * 0.46, fs, `rgba(255,255,255,${0.7 + p * 0.3})`, 900);
    if (phh > 60) fillText(ARROW_LABELS[l], px + pw / 2, py + phh * 0.46 + fs * 0.85, fs * 0.5, rgba(c, 0.9), 900);
  }
  void now;
}

function drawHUD(now) {
  const W = L.W;
  const hudW = Math.min(360, W - 150);
  // スコア
  fillText('SCORE', L.cx, 16, 11, 'rgba(255,255,255,0.65)', 800);
  ctx.font = `900 ${Math.min(36, W * 0.07)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.fillText(Math.floor(G.dispScore).toLocaleString(), L.cx, 42);
  // ゲージ
  const gy = 66, gh = 12, gx = L.cx - hudW / 2;
  rr(gx, gy, hudW, gh, 6); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  const gv = G.gauge / 100;
  if (gv > 0.005) {
    const gg = ctx.createLinearGradient(gx, 0, gx + hudW, 0);
    if (G.gauge < 30) { gg.addColorStop(0, '#ff3b5c'); gg.addColorStop(1, '#ff8a5c'); }
    else if (G.gauge < 70) { gg.addColorStop(0, '#ffd23f'); gg.addColorStop(1, '#ff9a3f'); }
    else { gg.addColorStop(0, '#3dffb0'); gg.addColorStop(1, '#4fc3ff'); }
    rr(gx, gy, hudW * gv, gh, 6); ctx.fillStyle = gg; ctx.fill();
    if (G.gauge >= 70) { ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.15 * Math.sin(now * 6)})`; rr(gx, gy, hudW * gv, gh, 6); ctx.fill(); }
  }
  if (FX.gaugeFlash > 0) { ctx.fillStyle = `rgba(255,60,90,${FX.gaugeFlash * 0.5})`; rr(gx, gy, hudW, gh, 6); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; rr(gx, gy, hudW, gh, 6); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(gx + hudW * 0.7 - 1, gy - 3, 2, gh + 6);
  fillText('GAUGE', gx - 6, gy + gh / 2, 10, 'rgba(255,255,255,0.7)', 800, 'right');
  // 曲の進行
  const st = songTime();
  const prog = FES.clamp(st / SONG.length, 0, 1);
  const py = gy + gh + 8;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(gx, py, hudW, 3);
  ctx.fillStyle = DIFFS[G.diff].color; ctx.fillRect(gx, py, hudW * prog, 3);
  // 難易度バッジ
  const d = DIFFS[G.diff];
  ctx.font = `900 11px ${FONT}`;
  const bw = ctx.measureText(d.label).width + 18;
  rr(gx + hudW - bw, py + 9, bw, 18, 9); ctx.fillStyle = d.color; ctx.fill();
  fillText(d.label, gx + hudW - bw / 2, py + 18, 11, '#101020', 900);
  // 現在のセクション名
  let secName = '';
  for (let i = 0; i < SONG.sections.length; i++) if (st >= SONG.sections[i].start && st < SONG.sections[i].end) secName = SONG.sections[i].name;
  if (secName) fillText(secName, gx, py + 18, 11, 'rgba(255,255,255,0.55)', 800, 'left');
}

function drawCenterText(now) {
  const cy = L.topY + (L.judgeY - L.topY) * 0.42;
  if (FX.count && (G.state === 'countin' || G.state === 'play')) {
    const age = now - FX.count.t;
    if (age < 0.6) {
      const sc = age < 0.1 ? 1.6 - age / 0.1 * 0.6 : 1 - (age - 0.1) * 0.25;
      const a = age < 0.45 ? 1 : 1 - (age - 0.45) / 0.15;
      ctx.save(); ctx.globalAlpha = Math.max(0, a);
      const go = FX.count.text === 'GO!';
      glowText(FX.count.text, L.cx, cy, Math.min(go ? 110 : 120, L.botW * 0.28) * sc, go ? '#ffd23f' : '#fff', go ? '#ff4f8b' : '#4fc3ff', 900, 30);
      ctx.restore();
    }
  }
  if (G.readyUntil > now && G.state !== 'pause') {
    const k = 0.5 + 0.5 * Math.sin(now * 12);
    glowText('READY', L.cx, cy, Math.min(64, L.botW * 0.16), `rgba(255,255,255,${0.6 + 0.4 * k})`, '#4fc3ff', 900, 20);
  }
  if (G.state === 'result' && G.failed === false && G.counts.MISS === 0 && G.notes.length) {
    glowText('FULL COMBO!', L.cx, cy, Math.min(56, L.botW * 0.14), '#ffd23f', '#ff4f8b', 900, 24);
  }
}

/* =====================================================================
   入力
   ===================================================================== */
document.addEventListener('keydown', e => {
  const code = e.code;
  if (code === 'Space' || code.startsWith('Arrow')) e.preventDefault();
  if (G.state === 'title') {
    if (e.repeat) return;
    if (code === 'ArrowLeft' || code === 'KeyA') { setDiff(G.diff - 1); FES.sfx('select'); }
    else if (code === 'ArrowRight' || code === 'KeyD') { setDiff(G.diff + 1); FES.sfx('select'); }
    else if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') { setDiff(Number(code.slice(5)) - 1); FES.sfx('select'); }
    else if (code === 'Enter' || code === 'Space') startGame();
    return;
  }
  if (code === 'Escape' || code === 'KeyP') {
    if (e.repeat) return;
    if (G.state === 'pause') resumeGame(); else pauseGame();
    return;
  }
  if (G.state === 'pause' || G.state === 'result') return;
  if (e.repeat) return;
  const lane = KEY_TO_LANE[code];
  if (lane != null) hitLane(lane);
});
document.addEventListener('keyup', e => {
  const lane = KEY_TO_LANE[e.code];
  if (lane != null) FX.press[lane] = Math.min(FX.press[lane], 0.6);
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (G.state !== 'play' && G.state !== 'countin') return;
  const lane = laneAtX(e.clientX);
  pointers.set(e.pointerId, lane);
  hitLane(lane);
});
const releasePointer = e => { const l = pointers.get(e.pointerId); pointers.delete(e.pointerId); if (l != null) FX.press[l] = Math.min(FX.press[l], 0.6); };
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerleave', releasePointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

$('startBtn').addEventListener('click', () => startGame());
$('resumeBtn').addEventListener('click', () => resumeGame());
$('quitBtn').addEventListener('click', () => quitToTitle());
Array.from($('diff').children).forEach((b, i) => b.addEventListener('click', () => { setDiff(i); FES.sfx('select'); }));
document.addEventListener('visibilitychange', () => { if (document.hidden && (G.state === 'play' || G.state === 'countin')) pauseGame(); });
window.addEventListener('resize', resize);

/* =====================================================================
   メインループ
   ===================================================================== */
let lastFrame = performance.now();
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (nowMs - lastFrame) / 1000));
  lastFrame = nowMs;
  const now = nowMs / 1000;
  try { update(dt, now); render(now); } catch (err) { /* 1フレームの例外で止まらない */ }
}
resize();
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
